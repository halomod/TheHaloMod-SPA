version: '3.5'

services:
  thehalomod-server:
    build: .
    ports:
      - ${FLASK_RUN_PORT}:${FLASK_RUN_PORT}
    links:
      - redis
    container_name: hmf-server
    # No stop_signal override: gunicorn (which replaced Flask's dev server)
    # treats SIGTERM as a graceful shutdown - waiting for in-flight requests,
    # e.g. a slow model computation, to finish - which is also Docker's own
    # default stop signal. The previous override to SIGINT was specific to
    # Flask's dev server; sending SIGINT to gunicorn instead triggers a
    # *quick*, non-graceful shutdown, which would cut off in-flight requests
    # on every deploy.
    restart: unless-stopped
    environment:
      - FLASK_RUN_PORT=${FLASK_RUN_PORT}
      - FLASK_RUN_HOST=${FLASK_RUN_HOST}
      - FLASK_ENV="production"
      - FLASK_DEBUG=False
      - FLASK_APP=halomod_app
      # Set so that python will output print statements when flask is running
      - PYTHONUNBUFFERED=False
      # Set so that the HTTPS cookies will go through on the remote server. 
      # The behavior is defined in "config.py"
      - USE_HTTPS_SESSION=True

  redis:
    image: "redis"
    container_name: hmf-redis-cache
    expose:
      - 6379
